spring:
  application:
    name: News Analyzer
bot:
  name: ${TG_BOT_NAME}
  token: ${TG_BOT_TOKEN}

deepseek:
  api:
    url: https://api.deepseek.com/v1/chat/completions
    key: ${DEEPSEEK_API_KEY}
  model: deepseek-chat
  system:
    role: system
  user:
    role: user

news:
  api:
    key: ${NEWS_API_KEY}
    url: https://newsapi.org/v2/everything
    language: ru
    page-size: 5