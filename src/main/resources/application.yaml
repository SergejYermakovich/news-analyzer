spring:
  application:
    name: News Analyzer
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.8
bot:
  name: ${TG_BOT_NAME}
  token: ${TG_BOT_TOKEN}

news:
  api:
    key: ${NEWS_API_KEY}
    url: https://newsapi.org/v2/everything
    language: ru
    page-size: 5